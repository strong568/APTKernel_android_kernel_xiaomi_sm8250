name: Build munch Kernel ksu noKsu

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: true
        default: 'munch'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential binutils ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-ksu-${{ github.event.inputs.ksu }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-ksu-${{ github.event.inputs.ksu }}-${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Setup ReSukiSU & Patch for 4.19 Non-GKI
      id: ksu_info
      run: |
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          # 1. Bật Kprobes trong defconfig để ReSukiSU nhận diện môi trường Non-GKI
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.device }}_defconfig"
          if [ -f "$DEFCONFIG_PATH" ]; then
            echo ">>> Injecting Kprobes into $DEFCONFIG_PATH..."
            sed -i '/CONFIG_KSU/d' "$DEFCONFIG_PATH"
            sed -i '/CONFIG_KPROBE/d' "$DEFCONFIG_PATH"
            cat << 'EOF' >> "$DEFCONFIG_PATH"
        CONFIG_KPROBES=y
        CONFIG_HAVE_KPROBES=y
        CONFIG_KPROBE_EVENTS=y
        CONFIG_MODULES=y
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=y
        # CONFIG_KSU_TP_HOOK is not set
        EOF
          fi

          echo "Setting up ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          # 2. Định vị thư mục KernelSU
          KSU_DIR=""
          if [ -d "drivers/kernelsu" ]; then
            KSU_DIR="drivers/kernelsu"
          elif [ -d "KernelSU" ]; then
            KSU_DIR="KernelSU"
          fi

          # 3. Vá Kbuild: Xóa hoàn toàn điều kiện $(error ...) dừng tiến trình
          if [ -n "$KSU_DIR" ]; then
            echo "Found ReSukiSU in $KSU_DIR. Patching Kbuild..."
            sed -i '/TP hooks/d' "$KSU_DIR/Kbuild" 2>/dev/null || true
            sed -i '/incompatible with Non-GKI/d' "$KSU_DIR/Kbuild" 2>/dev/null || true
            sed -i 's/-DKSU_TP_HOOK/-DKSU_KPROBES_HOOK/g' "$KSU_DIR/Kbuild" 2>/dev/null || true
            sed -i 's/CONFIG_KSU_TP_HOOK/CONFIG_KSU_KPROBES_HOOK/g' "$KSU_DIR/Kbuild" 2>/dev/null || true

            KSU_DATE=$(git -C "$KSU_DIR" log -1 --format="%Y.%m.%d" 2>/dev/null || date +"%Y.%m.%d")
            KSU_COMMIT=$(git -C "$KSU_DIR" rev-parse --short HEAD 2>/dev/null || echo "latest")
          else
            KSU_DATE=$(date +"%Y.%m.%d")
            KSU_COMMIT="latest"
          fi

          echo "ksu_tag=ReSukiSU_${KSU_DATE}" >> $GITHUB_OUTPUT
          echo "ksu_title=ReSukiSU (${KSU_DATE})" >> $GITHUB_OUTPUT
          echo "ksu_commit=$KSU_COMMIT" >> $GITHUB_OUTPUT
          echo "mgr_recommend=ReSukiSU / SukiSU Manager (bản phát hành ngày ${KSU_DATE} hoặc mới hơn)" >> $GITHUB_OUTPUT
          echo "mgr_link=https://github.com/ReSukiSU/ReSukiSU/releases" >> $GITHUB_OUTPUT
        else
          echo "KernelSU disabled."
          echo "ksu_tag=NoKSU" >> $GITHUB_OUTPUT
          echo "ksu_title=None" >> $GITHUB_OUTPUT
          echo "ksu_commit=none" >> $GITHUB_OUTPUT
          echo "mgr_recommend=Không cần cài Manager (Kernel không Root)" >> $GITHUB_OUTPUT
          echo "mgr_link=#" >> $GITHUB_OUTPUT
        fi

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh

        # Ngăn script build bên trong chạy lại setup.sh làm mất bản vá Kbuild
        sed -i 's|curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash|echo "[*] ReSukiSU handled by Actions"|g' build_kernel.sh || true

        ARGS="${{ github.event.inputs.device }}"

        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS resukisu"
        else
          ARGS="$ARGS noneksu"
        fi

        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS${{ github.event.inputs.target_os }}"
        fi

        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Detect SuSFS Version & Prepare Release
      id: prep
      run: |
        DETECTED_SUSFS=""
        
        # 1. Quét phiên bản trong file header susfs.h
        SUSFS_HEADER=$(find . -maxdepth 4 -type f -name "susfs.h" 2>/dev/null | head -n 1)
        if [ -n "$SUSFS_HEADER" ]; then
          DETECTED_SUSFS=$(grep -E 'SUSFS_VERSION' "$SUSFS_HEADER" | head -n 1 | awk -F'"' '{print $2}')
        fi

        # 2. Quét dự phòng trực tiếp trong binary Image vừa build
        if [ -z "$DETECTED_SUSFS" ]; then
          IMAGE_FILE=$(find out/ out_aosp/ out_miui/ arch/ -type f \( -name "Image" -o -name "Image.gz" \) 2>/dev/null | head -n 1)
          if [ -n "$IMAGE_FILE" ]; then
            DETECTED_SUSFS=$(strings "$IMAGE_FILE" | grep -ioE 'susfs[-_ ]?v?[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          fi
        fi

        if [ -n "$DETECTED_SUSFS" ]; then
          [[ ! "$DETECTED_SUSFS" =~ ^v ]] && DETECTED_SUSFS="v$DETECTED_SUSFS"
          SUSFS_NAME_TAG="SuSFS_${DETECTED_SUSFS}"
          SUSFS_STATUS="Có (${DETECTED_SUSFS})"
        else
          SUSFS_NAME_TAG="NoSuSFS"
          SUSFS_STATUS="Không phát hiện"
        fi

        echo "Phát hiện SuSFS: $SUSFS_STATUS"

        KSU_TAG="${{ steps.ksu_info.outputs.ksu_tag }}"
        BUILD_TIME=$(date +"%Y%m%d_%H%M")
        mkdir -p dist

        for f in APTKernel_*.zip; do
          if [ -f "$f" ]; then
            NEW_NAME="APTKernel-${{ github.event.inputs.device }}-${KSU_TAG}-${SUSFS_NAME_TAG}-${{ github.event.inputs.target_os }}.zip"
            cp "$f" "dist/$NEW_NAME"
            echo "Đã tạo gói: dist/$NEW_NAME"
          fi
        done

        cat <<EOF > release_notes.md
        ## 🚀 APTKernel - ${{ github.event.inputs.device }}

        ### 📋 Thông tin phiên bản:
        - **Thiết bị:** \`${{ github.event.inputs.device }}\`
        - **Hệ điều hành:** \`${{ github.event.inputs.target_os }}\`
        - **KernelSU:** \`${{ steps.ksu_info.outputs.ksu_title }}\`
        - **SuSFS (Tự nhận diện):** \`${SUSFS_STATUS}\`
        - **Thời gian build:** \`$(date -u +"%Y-%m-%d %H:%M:%S UTC")\`

        ---

        ### 🛡️ Chú thích về SuSFS:
        - Bản build đi kèm tính năng SuSFS ở cấp Kernel (nếu hiển thị trạng thái "Có").
        - Hỗ trợ ẩn mount point, giấu trạng thái root/unlock bootloader khỏi Play Integrity, ứng dụng ngân hàng và game.
        - **Yêu cầu:** Cài đặt thêm SuSFS Module tương thích để kích hoạt cấu hình ẩn.

        ---

        ### 📲 Khuyên dùng phiên bản Manager:
        - **Manager khuyến nghị:** **${{ steps.ksu_info.outputs.mgr_recommend }}**
        - **Tải Manager chính thức:** [ReSukiSU Releases trên GitHub](${{ steps.ksu_info.outputs.mgr_link }})
        EOF

        echo "tag_name=${{ github.event.inputs.device }}-${KSU_TAG}-${BUILD_TIME}" >> $GITHUB_OUTPUT
        echo "release_title=APTKernel ${{ github.event.inputs.device }} [${KSU_TAG}][${SUSFS_NAME_TAG}]" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ steps.ksu_info.outputs.ksu_tag }}
        path: dist/*.zip
        compression-level: 0

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.prep.outputs.tag_name }}
        name: ${{ steps.prep.outputs.release_title }}
        body_path: release_notes.md
        files: dist/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
