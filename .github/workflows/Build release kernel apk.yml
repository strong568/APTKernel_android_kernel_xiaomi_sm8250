name: Build release Kernel & apk

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code'
        required: true
        default: 'munch'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (BakaSU)'
        required: true
        type: boolean
        default: true
      droidspaces:
        description: 'Enable Droidspaces (LXC/Docker) support'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | Droidspaces:${{ github.event.inputs.droidspaces }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Cần thiết để GitHub Actions có quyền tạo Release và upload file
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev lz4 \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq unzip
          
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        ARGS="${{ github.event.inputs.device }}"
        
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi

        if [ "${{ github.event.inputs.droidspaces }}" == "true" ]; then
          ARGS="$ARGS droidspaces"
        fi
        
        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Read BakaSU Version
      id: bakasu
      run: |
        if [ -f .bakasu_version ]; then
          BAKASU_VERSION=$(cat .bakasu_version)
          BAKASU_VERSION_CODE=$(cat .bakasu_version_code 2>/dev/null || echo "unknown")
          echo "BAKASU_VERSION=$BAKASU_VERSION" >> $GITHUB_OUTPUT
          echo "BAKASU_VERSION_CODE=$BAKASU_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "BakaSU version: $BAKASU_VERSION (code $BAKASU_VERSION_CODE)"
        else
          echo "BAKASU_VERSION=not enabled" >> $GITHUB_OUTPUT
          echo "BAKASU_VERSION_CODE=not enabled" >> $GITHUB_OUTPUT
          echo "BakaSU not enabled (no version file)"
        fi

    - name: Fetch BakaSU APKs
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
      run: |
        mkdir -p apk_output
        echo "========================================"
        echo "[*] Fetching Actions Runs from Baka-SU/BakaSU (Success & Main branch only)..."

        BAKA_RUNS_JSON=$(curl -sL \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs?status=completed&conclusion=success&branch=main&per_page=30")

        FOUND_BAKA=0
        FOUND_RESUKI=0
        FOUND_SPOOFED=0

        for RUN_ID in $(echo "$BAKA_RUNS_JSON" | jq -r '.workflow_runs[]? | select(.event != "pull_request") | .id'); do
          [ "$FOUND_BAKA" -eq 1 ] && [ "$FOUND_RESUKI" -eq 1 ] && [ "$FOUND_SPOOFED" -eq 1 ] && break
          [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ] && continue
          
          echo "[*] Checking BakaSU Run ID: $RUN_ID"
          ART_JSON=$(curl -sL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Baka-SU/BakaSU/actions/runs/${RUN_ID}/artifacts")

          for b64 in $(echo "$ART_JSON" | jq -r '.artifacts[]? | @base64'); do
            [ -z "$b64" ] && continue
            _decoded=$(echo "$b64" | base64 --decode)
            ART_NAME=$(echo "$_decoded" | jq -r '.name // empty')
            ART_URL=$(echo "$_decoded" | jq -r '.archive_download_url // empty')
            
            [ -z "$ART_URL" ] && continue
            
            IS_SPOOFED=0
            IS_RESUKI=0
            IS_NORMAL=0
            
            if echo "$ART_NAME" | grep -qi "spoof"; then
              [ "$FOUND_SPOOFED" -eq 1 ] && continue
              IS_SPOOFED=1
            elif echo "$ART_NAME" | grep -qi "resuki"; then
              [ "$FOUND_RESUKI" -eq 1 ] && continue
              IS_RESUKI=1
            elif echo "$ART_NAME" | grep -qiE "manager|apk"; then
              [ "$FOUND_BAKA" -eq 1 ] && continue
              IS_NORMAL=1
            else
              continue
            fi
            
            TMP_ZIP="temp_bakasu_$$.zip"
            TMP_DIR="ext_bakasu_$$"
            
            curl -fLSs -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$TMP_ZIP" "$ART_URL"
            
            if [ -s "$TMP_ZIP" ]; then
              mkdir -p "$TMP_DIR"
              unzip -q -o "$TMP_ZIP" -d "$TMP_DIR/"

              TARGET_APK=$(find "$TMP_DIR" -type f -name "*.apk" | grep -v -i "debug" | grep -v -i "\.pr" | grep -i "arm64-v8a-release" | head -n 1)
              [ -z "$TARGET_APK" ] && TARGET_APK=$(find "$TMP_DIR" -type f -name "*.apk" | grep -v -i "debug" | grep -v -i "\.pr" | grep -i "arm64.*release" | head -n 1)
              [ -z "$TARGET_APK" ] && TARGET_APK=$(find "$TMP_DIR" -type f -name "*.apk" | grep -v -i "debug" | grep -v -i "\.pr" | head -n 1)
              
              if [ -n "$TARGET_APK" ]; then
                RAW_NAME=$(basename "$TARGET_APK")
                
                if [ "$IS_SPOOFED" -eq 1 ]; then
                  cp "$TARGET_APK" "apk_output/Action_Spoofed_BakaSU_${RAW_NAME}"
                  echo "✅ Saved Spoofed BakaSU: apk_output/Action_Spoofed_BakaSU_${RAW_NAME}"
                  FOUND_SPOOFED=1
                elif [ "$IS_RESUKI" -eq 1 ]; then
                  cp "$TARGET_APK" "apk_output/Action_ReSukiSU_${RAW_NAME}"
                  echo "✅ Saved ReSukiSU: apk_output/Action_ReSukiSU_${RAW_NAME}"
                  FOUND_RESUKI=1
                elif [ "$IS_NORMAL" -eq 1 ]; then
                  if echo "$RAW_NAME" | grep -qi "resuki"; then
                    if [ "$FOUND_RESUKI" -eq 0 ]; then
                      cp "$TARGET_APK" "apk_output/Action_ReSukiSU_${RAW_NAME}"
                      echo "✅ Saved ReSukiSU (fallback): apk_output/Action_ReSukiSU_${RAW_NAME}"
                      FOUND_RESUKI=1
                    fi
                  else
                    cp "$TARGET_APK" "apk_output/Action_BakaSU_${RAW_NAME}"
                    echo "✅ Saved BakaSU: apk_output/Action_BakaSU_${RAW_NAME}"
                    FOUND_BAKA=1
                  fi
                fi
              fi
              rm -rf "$TMP_DIR"
            fi
            rm -f "$TMP_ZIP"
          done
        done

    - name: Rename ZIP with BakaSU Version & Droidspaces
      run: |
        CODE_VER="${{ steps.bakasu.outputs.BAKASU_VERSION_CODE }}"
        for f in TanpaNama_*.zip; do
          [ -e "$f" ] || continue
          NEW_NAME="$f"
          
          # Nếu bật KSU và tồn tại file version, chèn phiên bản và v<version_code> vào tên file
          if [ "${{ github.event.inputs.ksu }}" == "true" ] && [ -f .bakasu_version ]; then
            BAKASU_VER=$(cat .bakasu_version)
            NEW_NAME=$(echo "$NEW_NAME" | sed "s/BakaSU-SuSFS-NoMount/BakaSU-${BAKASU_VER}-v${CODE_VER}-SuSFS-NoMount/g")
          fi
          
          # Nếu bật Droidspaces, chèn nhãn Droidspaces vào tên file
          if [ "${{ github.event.inputs.droidspaces }}" == "true" ]; then
            NEW_NAME=$(echo "$NEW_NAME" | sed "s/_anykernel3/-Droidspaces_anykernel3/g")
          fi
          
          if [ "$f" != "$NEW_NAME" ]; then
            echo "Renaming: $f -> $NEW_NAME"
            mv "$f" "$NEW_NAME"
          fi
        done

    - name: Upload Flashable ZIP (Artifact)
      uses: actions/upload-artifact@v7
      with:
        name: TanpaNama-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-KSU-v${{ steps.bakasu.outputs.BAKASU_VERSION_CODE }}-Droidspaces-${{ github.event.inputs.droidspaces }}-${{ github.run_id }}
        path: |
          TanpaNama_*.zip
          apk_output/*.apk
        compression-level: 0

    - name: Create GitHub Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          TanpaNama_*.zip
          apk_output/*.apk
        tag_name: kernel-${{ github.event.inputs.device }}-v${{ steps.bakasu.outputs.BAKASU_VERSION_CODE }}-${{ github.run_id }}
        name: "Kernel ${{ github.event.inputs.device }} | OS: ${{ github.event.inputs.target_os }} | KSU: ${{ github.event.inputs.ksu }} (v${{ steps.bakasu.outputs.BAKASU_VERSION_CODE }}) | Droidspaces: ${{ github.event.inputs.droidspaces }}"
        body: |
          ### 🛠️ Thông tin bản Build Kernel
          - **Thiết bị (Device):** `${{ github.event.inputs.device }}`
          - **Target OS:** `${{ github.event.inputs.target_os }}`
          - **KernelSU (BakaSU):** `${{ github.event.inputs.ksu }}` (Phiên bản: `${{ steps.bakasu.outputs.BAKASU_VERSION }}` - v${{ steps.bakasu.outputs.BAKASU_VERSION_CODE }})
          - **Droidspaces (LXC/Docker):** `${{ github.event.inputs.droidspaces }}`
          - **GitHub Run ID:** `${{ github.run_id }}`
          
          ### 📦 BakaSU Manager APKs
          *Các tệp APK Manager (BakaSU, ReSukiSU, Spoofed) được tải tự động từ nhánh main của Baka-SU/BakaSU.*
        draft: false
        prerelease: false
