name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (Device)'
        required: true
        default: 'munch'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (SukiSU-Ultra)'
        required: true
        type: boolean
        default: true
      target_os:
        description: 'Target OS'
        required: true
        type: choice
        default: 'both'
        options:
          - aosp
          - miui
          - both

jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Allows creating tags, releases, and uploading assets

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ runner.os }}-kernel-ccache-

    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz
        tar -zxvf Clang-16.0.6-20260807.tar.gz

    - name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        
        ARGS="${{ github.event.inputs.device }}"
        
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS sukisu"
        else
          ARGS="$ARGS noneksu"
        fi
        
        if [ "${{ github.event.inputs.target_os }}" != "both" ]; then
          ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        fi
        
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS

    - name: Prepare Release Metadata
      id: meta
      run: |
        BUILD_DATE=$(TZ="Asia/Ho_Chi_Minh" date '+%Y-%m-%d %H:%M:%S (UTC+7)')
        echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          KSU_VER=$(grep -E 'KERNELSU_VERSION|KS_VERSION' drivers/kernelsu/Makefile 2>/dev/null | head -n 1 | awk -F':=' '{print $2}' | tr -d ' ' || true)
          
          if [ -n "$KSU_VER" ]; then
            KSU_DETAIL="Version Driver: \`$KSU_VER\`"
          else
            KSU_DETAIL="SukiSU-Ultra Driver tích hợp"
          fi

          MANAGER_TEXT="- **Trạng thái Root:** Đã bật SukiSU-Ultra ($KSU_DETAIL)\n- **Manager khuyến nghị:** Cài đặt **SukiSU-Ultra Manager** chính thức.\n  - 🔗 [Tải SukiSU-Ultra Manager trên GitHub](https://github.com/ShirkNeko/SukiSU-Ultra/releases)\n  - ⚠️ *Lưu ý:* Luôn cài Manager bản mới nhất để tránh lỗi mismatch API."
        else
          MANAGER_TEXT="- **Trạng thái Root:** Không bật KSU (Stock kernel, không cần cài Manager)."
        fi

        {
          echo "manager_info<<EOF"
          echo -e "$MANAGER_TEXT"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: APTKernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: APTKernel_*.zip
        compression-level: 0

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.device }}-${{ github.run_id }}
        name: "APTKernel for ${{ github.event.inputs.device }} [${{ github.event.inputs.target_os }}] -${{ steps.meta.outputs.build_date }}"
        body: |
          ### 📦 Kernel Build Information
          - **Thiết bị (Device):** `${{ github.event.inputs.device }}`
          - **Hệ điều hành (Target OS):** `${{ github.event.inputs.target_os }}`
          - **Thời gian build:** `${{ steps.meta.outputs.build_date }}`
          - **Build Run ID:** `${{ github.run_id }}`

          ---
          ### 🔑 Hướng dẫn Manager & Root
          ${{ steps.meta.outputs.manager_info }}
        files: APTKernel_*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
